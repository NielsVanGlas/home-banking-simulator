spring.datasource.url: jdbc:postgresql://${DB_ADDRESS}:5432/homebanking?autoReconnect=true&useSSL=false
spring.datasource.username: ${DB_USER}
spring.datasource.password: ${DB_PASSWORD}
spring.datasource.driverClassName: org.postgresql.Driver

app:
  jwt:
    access: 31536000000
    refresh: 86400000
    otp: 300000
    secret:
  symmetric:
    secret:
    salt:

spring:
  jpa:
    generate-ddl: false
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        format_sql: true
        ddl-auto: update
  datasource:
    master:
      jdbcUrl: jdbc:postgresql://${DB_ADDRESS}:5432/homebanking-master-dev?autoReconnect=true&useSSL=false
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driverClassName-class-name: org.postgresql.Driver
    slave:
      jdbcUrl: jdbc:postgresql://${DB_ADDRESS_SLAVE}:5432/homebanking-slave-dev?autoReconnect=true&useSSL=false
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driverClassName-class-name: org.postgresql.Driver
  devtools:
    add-properties: false

logging:
  level:
    org:
      springframework:
        core:
          env=DEBUG: